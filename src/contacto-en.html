<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--#page page="contacto-en.html" altUrl="contacto.html" altLang="ES" ticker="Bali — Formentera" -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Daniela Cavestany</title>
<meta name="description" content="Write to me: commissions, collaborations and experiences. Bali — Formentera.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F5F3EE'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-style='italic' font-size='36' text-anchor='middle' fill='%23111'%3ED%3C/text%3E%3C/svg%3E">
<script type="module" src="js/main.js"></script>
</head>
<body>
<!--#include file="components/header-en.html" -->

<main class="wrap">
  <section class="block">
    <p class="meta">Contact</p>
    <h1 class="display"><em>Write to me.</em></h1>
    <br>
    <div class="grid-2" style="align-items:start">
      <div class="prose">
        <p>Every commission, collaboration or experience begins with an attentive gaze. Tell me about your project, space or idea.</p>
        <p class="meta">Direct email</p>
        <p><a class="link-quiet serif" style="font-size:24px" href="mailto:daniela@danielacavestany.com">daniela@danielacavestany.com</a></p>
        <p class="meta">Based in</p>
        <p>Bali — Formentera</p>
        <form class="contact" id="contact-form-en" action="mailto:daniela@danielacavestany.com">
          <label for="nombre">Name</label>
          <input id="nombre" name="nombre" type="text" required>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
          <label for="tipo">Type of enquiry</label>
          <select id="tipo" name="tipo">
            <option>Photo session / Commission</option>
            <option>Learning to see (iPhone workshop)</option>
            <option>Experience in a special place</option>
            <option>Styling / Art direction</option>
            <option>Artwork / Editions</option>
            <option>Other</option>
          </select>
          <label for="mensaje">Message</label>
          <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
          <br><br>
          <button class="btn btn-solid" type="submit">Send message</button>
          <p class="form-status" id="form-status-en" role="status"></p>
        </form>
        <script type="module">
          const formEn = document.getElementById('contact-form-en');
          formEn.addEventListener('submit', e => {
            if (!formEn.checkValidity()) return;
            e.preventDefault();
            const nombre  = document.getElementById('nombre').value.trim();
            const email   = document.getElementById('email').value.trim();
            const tipo    = document.getElementById('tipo')?.value || '';
            const mensaje = document.getElementById('mensaje').value.trim();
            const subject = encodeURIComponent(`Enquiry from ${nombre}${tipo ? ` — ${tipo}` : ''}`);
            const body    = encodeURIComponent(
              `Name: ${nombre}\nEmail: ${email}\nType of enquiry: ${tipo}\n\n${mensaje}`
            );
            window.location.href = `mailto:daniela@danielacavestany.com?subject=${subject}&body=${body}`;
            document.getElementById('form-status-en').textContent =
              'Your email app will open to send the message. I will reply within 24–48 hours.';
            formEn.reset();
          });
        </script>
      </div>
      <div>
        <figure class="plate">
          <img width="1129" height="1600" src="assets/bali/IMG_4491.jpg" alt="Two palm trees with a hammock, Bali" loading="lazy">
          <figcaption><span class="title">Rest</span><span class="meta">BALI-29</span></figcaption>
        </figure>
        <p class="meta">Contact · Bali — Formentera</p>
        <p class="quote" style="font-size:18px">Reply within 24–48 working hours.</p>
      </div>
    </div>
  </section>
</main>

<!--#include file="components/footer-en.html" -->

</body>
</html>
